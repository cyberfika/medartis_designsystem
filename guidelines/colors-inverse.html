<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head><body style="margin:0">
<div class="medartis-inverse" style="background:var(--surface-page);color:var(--text-primary);padding:24px 28px;min-height:180px">
<div style="font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--sky-300);margin-bottom:10px">#back2fun</div>
<div style="font:var(--type-h1)">Move again. Enjoy life.</div>
<p style="font:var(--type-body);color:var(--text-secondary);margin:14px 0 0;max-width:52ch">Body copy drops to 68% white. Links and rules pick up sky-300. Primary buttons invert to a white fill.</p>
<div style="display:flex;gap:10px;margin-top:18px"><span style="background:var(--action-primary-bg);color:var(--action-primary-fg);padding:10px 20px;font:var(--type-button)">Contact us</span><span style="border:1px solid var(--action-secondary-border);color:var(--action-secondary-fg);padding:10px 20px;font:var(--type-button)">Explore</span></div>
</div></body></html>
