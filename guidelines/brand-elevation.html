<!-- @dsCard group="Brand" viewport="700x170" name="Elevation & focus" subtitle="Only three shadows exist; focus is a two-ring outline, never a glow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;font:var(--type-body);background:var(--surface-page)}</style></head><body>
<div style="display:flex;gap:18px;align-items:center">
<div style="width:120px;height:80px;background:var(--surface-card);border:1px solid var(--border-default);box-shadow:var(--shadow-none);display:grid;place-items:center;font:var(--type-note);color:var(--text-secondary)">none</div><div style="width:120px;height:80px;background:var(--surface-card);border:1px solid var(--border-default);box-shadow:var(--shadow-hover);display:grid;place-items:center;font:var(--type-note);color:var(--text-secondary)">hover</div><div style="width:120px;height:80px;background:var(--surface-card);border:1px solid var(--border-default);box-shadow:var(--shadow-raised);display:grid;place-items:center;font:var(--type-note);color:var(--text-secondary)">raised</div><div style="width:120px;height:80px;background:var(--surface-card);border:1px solid var(--border-default);box-shadow:var(--shadow-overlay);display:grid;place-items:center;font:var(--type-note);color:var(--text-secondary)">overlay</div>
<button style="height:40px;padding:0 20px;background:var(--medartis-black);color:#fff;border:0;font:var(--type-button);box-shadow:var(--focus-ring)">focus ring</button>
</div></body></html>
