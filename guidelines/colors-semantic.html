<!-- @dsCard group="Colors" viewport="700x180" name="Semantic status" subtitle="Soft fill + saturated mark for validation and alerts" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;font:var(--type-body);background:var(--surface-page)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="background:var(--status-success-soft);border-left:3px solid var(--status-success);padding:14px 16px"><div style="font:var(--weight-medium) 14px/1.3 var(--font-sans)">Success</div><div style="font:var(--type-note);color:var(--text-secondary);margin-top:4px">--status-success</div><div style="font:var(--type-note);color:var(--text-muted)">--status-success-soft</div></div><div style="background:var(--status-danger-soft);border-left:3px solid var(--status-danger);padding:14px 16px"><div style="font:var(--weight-medium) 14px/1.3 var(--font-sans)">Danger</div><div style="font:var(--type-note);color:var(--text-secondary);margin-top:4px">--status-danger</div><div style="font:var(--type-note);color:var(--text-muted)">--status-danger-soft</div></div><div style="background:var(--status-warning-soft);border-left:3px solid var(--status-warning);padding:14px 16px"><div style="font:var(--weight-medium) 14px/1.3 var(--font-sans)">Warning</div><div style="font:var(--type-note);color:var(--text-secondary);margin-top:4px">--status-warning</div><div style="font:var(--type-note);color:var(--text-muted)">--status-warning-soft</div></div><div style="background:var(--status-info-soft);border-left:3px solid var(--status-info);padding:14px 16px"><div style="font:var(--weight-medium) 14px/1.3 var(--font-sans)">Info</div><div style="font:var(--type-note);color:var(--text-secondary);margin-top:4px">--status-info</div><div style="font:var(--type-note);color:var(--text-muted)">--status-info-soft</div></div>
</div></body></html>
