<!-- @dsCard group="Slides" viewport="1280x720" name="Full deck" subtitle="All eleven layouts — arrow keys or click to advance" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>html,body{margin:0;padding:0;background:var(--grey-150)}#root{width:1280px;height:720px}</style>
<style>#root{position:relative}.nav{position:fixed;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.82);color:#fff;font:var(--type-note);z-index:9}.nav button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;width:28px;height:22px;cursor:pointer}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const S = window.MedartisDesignSystem_dbc0f7;
const IM='../assets/imagery/', LG='../assets/logo', IC='../assets/icons';
const P=[['ANNA KELLER','Chief Executive Officer','campaign-pointing.png'],['MARC BRUNNER','Chief Financial Officer','campaign-hands.png'],['SOPHIE DUBOIS','Chief Commercial Officer','campaign-handstand.jpg'],['JAN DEBEIJ','Chief Technology Officer','campaign-sprinter.png'],['LEA HOFER','VP Upper Extremities','campaign-duo-mask.jpg'],['TOM ADLER','VP Lower Extremities','campaign-prosthetic-leg.png'],['MIRIAM MARKS','VP CMF','campaign-arm.png'],['GREG PICKERING','VP CMX','campaign-bionic-hands.png']];
const F='Commercial Plan 2026 — Overview';
const SLIDES=[
<S.TitleSlide assetBase={LG} title="Commercial Plan 2026" speaker="Dr. Speaker Name, Chief Commercial Officer" dateAndPlace="Basel, 31 July 2026" image={IM+'campaign-sprinter.png'} imagePosition="60% center"/>,
<S.AgendaSlide assetBase={LG} page="2" footer={F} items={[{label:'Where we stand',meta:'Group performance'},{label:'Portfolio & pipeline',meta:'Upper, Lower, CMF, CMX'},{label:'Market outlook',meta:'Extremities & CMF'},{label:'Commercial priorities',meta:'FY26'},{label:'Education & research',meta:'Quickminds'},{label:'Next steps',meta:'Q&A'}]}/>,
<S.SectionSlide assetBase={LG} page="3" kicker="Chapter 02" title="Portfolio & pipeline" lead="Precision-engineered solutions for skull and extremity surgery — from 0.9 mm midface plates to patient-specific titanium." image={IM+'campaign-bionic-hands.png'} imagePosition="55% center"/>,
<S.ImageTextSlide assetBase={LG} page="4" footer={F} title="It takes more than a plate." image={IM+'campaign-arm.png'} body={['Anatomically pre-contoured plates in 0.9 to 3.5 mm','TriLock multidirectional locking in every system','SpeedTip CCS cannulated compression screws','CMX patient-specific implants and cutting guides']}/>,
<S.ImageTextSlide tone="dark" assetBase={LG} page="5" footer={F} title="Move again." image={IM+'campaign-handstand.jpg'} body={['Nine subsidiaries, more than fifty distributor markets','Founded 1997 in Basel, listed on SIX as MED','Swiss Medtech Award 2026','CADskills joins the group in 2026']}/>,
<S.ColumnsSlide assetBase={LG} page="6" footer={F} title="Three service pillars" columns={[{icon:IC+'cursor-click.svg',title:'CMX Services',body:'Order a custom implant, saw or drill guide for complex cases, designed with our engineers.'},{icon:IC+'mail.svg',title:'Clinical Research',body:'Engaged in research. Partnering with surgeons on evidence that changes practice.'},{icon:IC+'location.svg',title:'New Idea Submission',body:'Together we revolutionize treatment options for orthopedic diseases.'}]}/>,
<S.ChartSlide assetBase={LG} page="7" footer={F} title="Market outlook" note="Illustrative figures for template demonstration only." stats={[{value:'230',unit:'MCHF',label:'Group revenue'},{value:'1997',label:'Founded in Basel'},{value:'14',label:'Subsidiaries'},{value:'>50',label:'Distributor markets'}]} series={[{label:'2021',value:110},{label:'2022',value:139},{label:'2023',value:168},{label:'2024',value:191},{label:'2025',value:212},{label:'2026e',value:230}]}/>,
<S.QuoteSlide assetBase={LG} page="8" quote="Six weeks after the plate went in, I was back on my bike." author="Peter Neuenschwander" role="Patient story, Basel" image={IM+'campaign-prosthetic-leg.png'} imagePosition="70% center"/>,
<S.TeamSlide assetBase={LG} page="9" footer={F} title="Leadership" people={P.map(([name,job,ph])=>({name,job,photo:IM+ph}))}/>,
<S.ThankYouSlide assetBase={LG} iconBase={IC} symbol={LG+'/medartis-symbol-white.png'}/>,
<S.ClosingSlide assetBase={LG} image={IM+'campaign-hands.png'} imagePosition="72% center"/>];
function Deck(){
  const [i,setI]=React.useState(0);
  React.useEffect(()=>{const h=e=>{if(e.key==='ArrowRight')setI(n=>Math.min(n+1,SLIDES.length-1));if(e.key==='ArrowLeft')setI(n=>Math.max(n-1,0))};window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h)},[]);
  return <div><div onClick={()=>setI(n=>(n+1)%SLIDES.length)}>{SLIDES[i]}</div>
  <div className="nav"><button onClick={()=>setI(n=>Math.max(n-1,0))}>‹</button><span>{i+1} / {SLIDES.length}</span><button onClick={()=>setI(n=>Math.min(n+1,SLIDES.length-1))}>›</button></div></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Deck/>);
</script></body></html>
