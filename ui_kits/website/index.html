<!DOCTYPE html><html><head><meta charset="utf-8"><title>Medartis — website UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0}#root{min-width:1280px}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="shell.kit.jsx"></script>
<script type="text/babel" src="home.kit.jsx"></script>
<script type="text/babel" src="solution.kit.jsx"></script>
<script type="text/babel" src="news.kit.jsx"></script>
<script type="text/babel" src="contact.kit.jsx"></script>
<script type="text/babel">
const ROUTES = {
  Home: { active: null, render: (go) => <HomeScreen onNavigate={go} /> },
  Solutions: { active: 'Solutions', render: (go) => <SolutionScreen onNavigate={go} /> },
  News: { active: 'About Us', render: () => <NewsScreen /> },
  Contact: { active: 'About Us', render: () => <ContactScreen /> },
};
const ALIAS = { Procedures: 'Solutions', Resources: 'Solutions', 'About Us': 'News', Investors: 'News', Education: 'News', Career: 'Contact', Research: 'News', Medartis: 'Home' };

function App() {
  const [route, setRoute] = React.useState('Home');
  const go = (label) => {
    const key = ROUTES[label] ? label : ALIAS[label];
    if (key) setRoute(key);
  };
  return (
    <Shell active={ROUTES[route].active} onNavigate={go}>
      {ROUTES[route].render(go)}
      <div style={{ position: 'fixed', right: 16, bottom: 16, display: 'flex', gap: 6, background: 'rgba(0,0,0,.85)', padding: 8, zIndex: 900 }}>
        {Object.keys(ROUTES).map((r) => (
          <button key={r} onClick={() => setRoute(r)} style={{ background: r === route ? '#fff' : 'transparent', color: r === route ? '#000' : '#fff', border: '1px solid rgba(255,255,255,.4)', padding: '6px 10px', font: 'var(--type-note)', cursor: 'pointer' }}>{r}</button>
        ))}
      </div>
    </Shell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
